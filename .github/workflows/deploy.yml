name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Set homepage and CNAME
        run: |
          BRANCH=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
          if [[ "$BRANCH" == "main" ]]; then
            echo "Setting homepage for MAIN"
            jq '.homepage="https://theonecrawlingsolution.com"' package.json > temp.json && mv temp.json package.json
            mkdir -p public
            echo "theonecrawlingsolution.com" > public/CNAME
          else
            echo "Setting homepage for DEVELOP"
            jq '.homepage="https://develop.theonecrawlingsolution.com/develop"' package.json > temp.json && mv temp.json package.json
            mkdir -p public
            echo "develop.theonecrawlingsolution.com" > public/CNAME
          fi

      - name: Build project
        run: npm run build

      - name: Copy CNAME to build folder
        run: cp public/CNAME build/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_PAT }}
          publish_branch: gh-pages
          publish_dir: ./build
          keep_files: true
          destination_dir: ${{ github.ref == 'refs/heads/main' && '.' || 'develop' }}
