name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Set homepage and CNAME
        run: |
          echo "Setting homepage for MAIN"
          jq '.homepage="https://theonecrawlingsolution.com"' package.json > temp.json && mv temp.json package.json
          mkdir -p public
          echo "theonecrawlingsolution.com" > public/CNAME

      - name: 📦 Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_PAT }}
          publish_branch: gh-pages
          publish_dir: ./build
          keep_files: true
