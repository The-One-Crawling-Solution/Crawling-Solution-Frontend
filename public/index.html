<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The One Crawling Solution specializes in advanced web scraping and data extraction services, empowering businesses to harness web data efficiently, securely, and at scale."

      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="The One Crawling Solution" />
    <meta
      property="og:description"
      content="Expert in web scraping and data extraction services."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:url" content="https://theonecrawlingsolution.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The One Crawling Solution" />
    <meta
      name="twitter:description"
      content="Expert in web scraping and data extraction services."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/og-image.jpg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The One Crawling Solution",
        "url": "https://theonecrawlingsolution.com",
        "logo": "https://theonecrawlingsolution.com/images/logo.png",
        "sameAs": [
          "https://www.facebook.com/theonecrawlingsolution",
          "https://twitter.com/theonecrawlingsolution",

        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91-96645-08201",
          "contactType": "Customer Support"
        }

    <!-- HSTS Header via meta (for environments where server headers cannot be set) -->

      content="max-age=31536000; includeSubDomains"

    <style>
      #chatbase-bubble-button,
