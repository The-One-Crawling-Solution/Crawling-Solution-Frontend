server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the app with React Router
    location / {
        try_files $uri /index.html;
    }

    # Static files (optional)
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
